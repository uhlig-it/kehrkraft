name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Audit dependencies for known vulnerabilities
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Install Typst
        # Needed by the PDF tests; they skip when the binary is missing. The
        # version matches the one bundled in the Docker image.
        run: |
          curl -L --fail -o typst.tar.xz https://github.com/typst/typst/releases/download/v0.15.1/typst-x86_64-unknown-linux-musl.tar.xz
          # The archive contains a single top-level directory holding the
          # binary; /usr/local/bin is on PATH, /usr/local is not.
          sudo tar -xJf typst.tar.xz -C /usr/local/bin --strip-components=1
          typst --version
      - name: Run unit tests
        run: cargo test --lib --bins
      - name: Run integration tests
        # unit_building_crud, unit_pdf_response, and e2e are the Cargo test
        # targets declared/discovered for this repo (tests/unit/plan_crud.rs is
        # intentionally not a target).
        run: cargo test --test unit_building_crud --test unit_pdf_response --test e2e
