<!doctype html>
<html lang="{{ ui.lang_code() }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Kehrkraft: {{ title }}{% endblock %}</title>
    <link rel="stylesheet" href="/static/app.css">
    <link rel="icon" href="/kehrkraft.svg" type="image/svg+xml">
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-inner">
        <a class="brand" href="/admin">
          <img src="/kehrkraft.svg" alt="{{ ui.t("brand.alt") }}" class="brand-logo">
          <span class="brand-name">Kehrkraft</span>
        </a>
        <nav class="topnav">
          <a href="/admin">{{ ui.t("nav.buildings") }}</a>
          <a href="/admin/people">{{ ui.t("nav.people") }}</a>
        </nav>
        <nav class="lang-switch" aria-label="{{ ui.t("lang.switch") }}">
          <a class="lang-link{% if ui.lang_code() == "de" %} is-active{% endif %}" href="/language/de" hreflang="de" lang="de">Deutsch</a>
          <a class="lang-link{% if ui.lang_code() == "en" %} is-active{% endif %}" href="/language/en" hreflang="en" lang="en">English</a>
        </nav>
      </div>
    </header>
    <main class="container">
      {% block content %}{% endblock %}
    </main>
    <footer class="footer">{{ ui.t("footer.tagline") }}</footer>
    <script src="/static/htmx.min.js"></script>
    <script src="/static/sortable.min.js"></script>
    <script>
      // Owner suggestions: picking a known name from the suggestion list also
      // fills the matching e-mail field (when still empty), so reusing an
      // existing owner works in one step. No suggest-and-select flow, no
      // separate person page: the owner fields create or reuse a person on
      // submit (same e-mail = same person, resolved by the server).
      document.addEventListener('input', (event) => {
        const input = event.target;
        const emailFieldId = input.dataset.emailField;
        if (!emailFieldId) return;
        const list = document.getElementById(input.getAttribute('list'));
        if (!list) return;
        const picked = [...list.options].filter((o) => o.value === input.value);
        if (picked.length !== 1) return;
        const emailField = document.getElementById(emailFieldId);
        if (emailField && emailField.value === '') {
          emailField.value = picked[0].dataset.email || '';
        }
      });

      // Person rows of the owner forms (repeatable name/e-mail pairs): the
      // "add person" button appends a row, the per-row remove button drops
      // one; the last remaining row cannot be removed.
      document.addEventListener('click', (event) => {
        const addBtn = event.target.closest('.person-row-add');
        if (addBtn) {
          // The button sits next to (not inside) the row list, so locate
          // the .person-rows container on its own.
          const rowsEl =
            addBtn.closest('.person-rows') ||
            addBtn.parentElement?.querySelector('.person-rows');
          if (rowsEl) {
            personRowAppend(rowsEl);
            personRowsRefresh(rowsEl);
          }
          return;
        }
        const rowsEl = event.target.closest('.person-rows');
        if (!rowsEl) return;
        const row = event.target.closest('.person-row');
        if (event.target.closest('.person-row-remove') && row) {
          row.remove();
          personRowsRefresh(rowsEl);
        }
      });

      function nextPersonIndex(rowsEl) {
        let max = 0;
        rowsEl.querySelectorAll('[name^="person_"]').forEach((input) => {
          const match = input.name.match(/^person_(\d+)_(?:name|email|display_name)$/);
          if (match) max = Math.max(max, Number(match[1]));
        });
        return max + 1;
      }

      function personRowAppend(rowsEl) {
        const template = rowsEl.querySelector('.person-row');
        if (!template) return;
        const scope = rowsEl.dataset.scope || 'person';
        const index = nextPersonIndex(rowsEl);
        const clone = template.cloneNode(true);
        const nameInput = clone.querySelector('[name$="_name"]');
        const displayInput = clone.querySelector('[name$="_display_name"]');
        const emailInput = clone.querySelector('[name$="_email"]');
        clone.querySelectorAll('input').forEach((input) => { input.value = ''; });
        if (nameInput) nameInput.name = `person_${index}_name`;
        if (displayInput) displayInput.name = `person_${index}_display_name`;
        if (emailInput) emailInput.name = `person_${index}_email`;
        if (emailInput) {
          const id = `${scope}-email-${index}`;
          emailInput.id = id;
          if (nameInput) nameInput.dataset.emailField = id;
        }
        rowsEl.appendChild(clone);
      }

      function personRowsRefresh(rowsEl) {
        const rows = rowsEl.querySelectorAll('.person-row');
        const canRemove = rows.length > 1;
        rows.forEach((rowEl) => {
          const button = rowEl.querySelector('.person-row-remove');
          if (button) button.hidden = !canRemove;
        });
      }

      document.addEventListener('DOMContentLoaded', () => {
        document.querySelectorAll('.person-rows').forEach(personRowsRefresh);
      });
    </script>
  </body>
</html>
