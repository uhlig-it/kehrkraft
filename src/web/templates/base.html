<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Kehrkraft{% endblock %}</title>
    <link rel="stylesheet" href="/static/app.css">
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-inner">
        <a class="brand" href="/admin">
          <img src="/kehrkraft.svg" alt="Kehrkraft logo" class="brand-logo">
          <span class="brand-name">Kehrkraft</span>
        </a>
        <nav class="topnav">
          <a href="/admin">Buildings</a>
        </nav>
      </div>
    </header>
    <main class="container">
      {% block content %}{% endblock %}
    </main>
    <footer class="footer">Kehrkraft &mdash; Kehrwoche Cleaning Schedules</footer>
  </body>
</html>
