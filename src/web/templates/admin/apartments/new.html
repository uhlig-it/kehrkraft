{% extends "base.html" %}

{% block title %}Kehrkraft: {{ title }}{% endblock %}

{% block content %}
<nav class="breadcrumb">
  <a href="/admin">Gebäude</a><span class="sep">/</span><a href="/admin/buildings/{{ building.id }}">{{ building.name }}</a><span class="sep">/</span><span>Neue Wohnung</span>
</nav>

<div class="page-header">
  <h1>Neue Wohnung: {{ building.name }}</h1>
</div>

<div class="card">
  {% include "admin/_error.html" %}
  <form method="post" action="/admin/buildings/{{ building.id }}/apartments">
    <label class="field">
      Name <span class="hint">(max. 30 Zeichen)</span>
      <input type="text" name="name" maxlength="30" value="{{ name }}" required />
    </label>

    <label class="field">
      Beschreibung <span class="hint">(optional)</span>
      <input type="text" name="description" value="{{ description }}" />
    </label>

    <div class="form-actions">
      <button type="submit" class="btn btn-primary">Wohnung anlegen</button>
      <a class="btn btn-secondary" href="/admin/buildings/{{ building.id }}">Abbrechen</a>
    </div>
  </form>
</div>
{% endblock %}
