<tbody id="apartments-tbody"
       hx-post="/admin/buildings/{{ building.id }}/apartments/reorder"
       hx-trigger="end"
       hx-target="#apartments-tbody"
       hx-swap="outerHTML"
       hx-indicator="#apartment-sort-indicator"
       hx-on:load="new Sortable(this, {
         animation: 150,
         ghostClass: 'sortable-ghost',
         handle: '.drag-handle',
         onEnd: function () { this.option('disabled', true); }
       })"
       hx-on::after:swap="Sortable.get(this).option('disabled', false)">
  {% for a in apartments %}
  <tr>
    <td class="col-drag">
      <span class="drag-handle" title="{{ ui.t("apartments.drag_title") }}">⋮⋮</span>
    </td>
    <td data-label="Name">
      <span class="floor-plate" aria-hidden="true">{{ a.plate }}</span>
      <a class="link-strong" href="/admin/buildings/{{ building.id }}/apartments/{{ a.apartment.id }}">{{ a.apartment.name }}</a>
      <span class="badge badge-muted">Rotation {{ a.rotation }}</span>
    </td>
    <td data-label="{{ ui.t("form.description") }}">{{ a.apartment.description }}</td>
    <td class="col-actions">
      <input type="hidden" name="item" value="{{ a.apartment.id }}" />
      <form class="inline" method="post" action="/admin/buildings/{{ building.id }}/apartments/{{ a.apartment.id }}/delete"
            hx-post="/admin/buildings/{{ building.id }}/apartments/{{ a.apartment.id }}/delete"
            hx-confirm="{{ ui.t("apartments.delete_confirm") }}">
        <button type="submit" class="btn btn-danger btn-sm">{{ ui.t("common.delete") }}</button>
      </form>
    </td>
  </tr>
  {% endfor %}
</tbody>
