{% extends "base.html" %}

{% block title %}Kehrkraft: {{ title }}{% endblock %}

{% block content %}
<nav class="breadcrumb">
  <a href="/admin">Gebäude</a><span class="sep">/</span><span>Neues Gebäude</span>
</nav>

<div class="page-header">
  <h1>Neues Gebäude anlegen</h1>
</div>

<div class="card">
  {% include "admin/_error.html" %}
  <form method="post" action="/admin/buildings">
    <label class="field">
      Name <span class="hint">(max. 30 Zeichen)</span>
      <input type="text" name="name" maxlength="30" value="{{ name }}" required>
    </label>

    <label class="field">
      Beschreibung <span class="hint">(optional)</span>
      <input type="text" name="description" value="{{ description }}">
    </label>

    <fieldset>
      <legend>Ansprechpartner (Administrator)</legend>
      <label class="field">
        Name
        <input type="text" name="admin_name" value="{{ admin_name }}" required>
      </label>
      <label class="field">
        E-Mail
        <input type="email" name="admin_email" value="{{ admin_email }}" required>
      </label>
    </fieldset>

    <div class="form-actions">
      <button type="submit" class="btn btn-primary">Gebäude anlegen</button>
      <a class="btn btn-secondary" href="/admin">Abbrechen</a>
    </div>
  </form>
</div>
{% endblock %}
