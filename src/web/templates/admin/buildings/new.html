{% extends "base.html" %}

{% block title %}{{ title }} · Kehrkraft{% endblock %}

{% block content %}
<nav class="breadcrumb">
  <a href="/admin">Buildings</a><span class="sep">/</span><span>New Building</span>
</nav>

<div class="page-header">
  <h1>Create a New Building</h1>
</div>

<div class="card">
  {% include "admin/_error.html" %}
  <form method="post" action="/admin/buildings">
    <label class="field">
      Name <span class="hint">(max. 30 characters)</span>
      <input type="text" name="name" maxlength="30" value="{{ name }}" required>
    </label>

    <label class="field">
      Description <span class="hint">(optional)</span>
      <input type="text" name="description" value="{{ description }}">
    </label>

    <fieldset>
      <legend>Administrator (contact)</legend>
      <label class="field">
        Name
        <input type="text" name="admin_name" value="{{ admin_name }}" required>
      </label>
      <label class="field">
        Email
        <input type="email" name="admin_email" value="{{ admin_email }}" required>
      </label>
    </fieldset>

    <div class="form-actions">
      <button type="submit" class="btn btn-primary">Create Building</button>
      <a class="btn btn-secondary" href="/admin">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
