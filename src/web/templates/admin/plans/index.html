{% extends "base.html" %}

{% block title %}Plans{% endblock %}

{% block content %}
<h1>Plans</h1>

<p><a href="/admin/plans/new">Create New Plan</a></p>

{% if plans.len() == 0 %}
<p>No plans yet.</p>
{% else %}
<table role="grid">
  <thead>
    <tr>
      <th>Name</th>
      <th>Secret URL</th>
      <th>Actions</th>
    </tr>
  </thead>
  <tbody>
  {% for p in plans %}
    <tr>
      <td><a href="/admin/plans/{{ p.id }}">{{ p.name }}</a></td>
      <td><code>/p/{{ p.secret_slug }}/kehrwoche.pdf</code></td>
      <td>
        <form method="post" action="/admin/plans/{{ p.id }}/delete" style="display:inline">
          <button type="submit">Delete</button>
        </form>
      </td>
    </tr>
  {% endfor %}
  </tbody>
</table>
{% endif %}
{% endblock %}
