{% extends "base.html" %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
<h1>Edit Tenant</h1>

<form method="post" action="/admin/plans/{{ plan_id }}/tenants/{{ tenant.id }}">
  <label>
    Name
    <input type="text" name="name" value="{{ tenant.name }}" required />
  </label>

  <label>
    Email
    <input type="email" name="email" value="{{ tenant.email }}" required />
  </label>

  <label>
    Tenancy Start Date
    <input type="date" name="start_date" value="{{ tenant.start_date }}" required />
  </label>

  <label>
    Tenancy End Date (optional)
    <input type="date" name="end_date" value="{% if tenant.end_date.is_some() %}{{ tenant.end_date.as_ref().unwrap() }}{% endif %}" />
  </label>

  <button type="submit">Save Changes</button>
  <a href="/admin/plans/{{ plan_id }}/tenants">Cancel</a>
</form>
{% endblock %}
