# git-cliff ~ configuration file
# https://git-cliff.org/docs/configuration
#
# scripts/release.sh prepends a "## [<version>] - <date>" section to
# CHANGELOG.md on release; .github/workflows/release.yml extracts that same
# "## [<version>]" section as the GitHub release notes, so keep the heading
# format in the body template in sync with the workflow's awk script.

[changelog]
# Used by `--prepend` to remove the previous header.
header_marker = "<!-- git-cliff: end of header -->"
header = """\
# Changelog

All notable changes to this project will be documented in this file.

<!-- git-cliff: end of header -->"""
# A Tera template to be rendered for each release in the changelog.
# See https://keats.github.io/tera/#getting-started
# Note: `group_by` is the 2.13-era filter; git-cliff >= 2.14 added
# `commit_groups(groups=commit_parsers_groups)` for order-preserving groups.
body = """
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits %}
        - {% if commit.scope %}*({{ commit.scope }})* {% endif %}\
            {% if commit.breaking %}[**breaking**] {% endif %}\
            {{ commit.message | split(pat="\n") | first | upper_first }}\
    {% endfor %}
{% endfor %}
"""
# Remove leading and trailing whitespaces from the changelog's body.
trim = true
# Render body even when there are no releases to process.
render_always = true

[git]
# Parse commits according to the conventional commits specification.
conventional_commits = true
# The pre-release history isn't conventional; keep those commits so they land
# in the catch-all "Other" group below.
filter_unconventional = false
# Match this repository's release tags (v0.1.0, ...).
tag_pattern = "v[0-9].*"
# Assign commits to keep-a-changelog-style groups based on their message.
commit_parsers = [
    { message = "^feat", group = "Added" },
    { message = "^fix", group = "Fixed" },
    { message = "^refactor", group = "Changed" },
    { message = "^docs", group = "Changed" },
    { message = "^test", group = "Changed" },
    { message = "^chore", group = "Changed" },
    { message = ".*TODO.*", skip = true },
    # Catch-all for commit messages that predate conventional commits.
    { message = ".*", group = "Other" },
]