repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      # sqlx checksums migration files at startup; any byte change to an
      # applied migration (even a trailing newline) breaks existing databases
      # with VersionMismatch. Keep migration files byte-stable and excluded
      # from content-normalizing hooks.
      - id: trailing-whitespace
        exclude: ^migrations/.*\.sql$
      - id: end-of-file-fixer
        exclude: ^migrations/.*\.sql$
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: detect-private-key

  - repo: https://github.com/koalaman/shellcheck-precommit
    rev: v0.10.0
    hooks:
      - id: shellcheck
        files: ^scripts/.*\.sh$

  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --all --check
        language: system
        pass_filenames: false
        files: ^(src/.*\.rs|tests/.*\.rs)$

      - id: cargo-clippy
        name: cargo clippy
        entry: sh -c 'SQLX_OFFLINE=true cargo clippy --all-targets -- -D warnings'
        language: system
        pass_filenames: false
        files: ^(src/.*\.rs|tests/.*\.rs|Cargo\.(toml|lock))$

      - id: cargo-audit
        name: cargo audit
        entry: cargo audit
        language: system
        pass_filenames: false
        files: ^Cargo\.(toml|lock)$
