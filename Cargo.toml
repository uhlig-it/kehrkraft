[package]
name = "kehrkraft"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT OR Apache-2.0"

[dependencies]
axum = "0.8"
base64 = "0.22"
askama = "0.16"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
serde = { version = "1", features = ["derive"] }
rand = "0.9"
chrono = "0.4"
tower-http = { version = "0.6", features = ["trace", "compression-gzip", "limit"] }

[dev-dependencies]
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

[[test]]
name = "unit_plan_crud"
path = "tests/unit/plan_crud.rs"

[[test]]
name = "unit_pdf_response"
path = "tests/unit/pdf_response.rs"
