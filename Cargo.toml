[package]
name = "kehrkraft"
version = "0.6.0"
edition = "2021"
publish = false
license = "MIT OR Apache-2.0"

[dependencies]
axum = "0.8"
base64 = "0.23"
askama = "0.16"
form_urlencoded = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
serde = { version = "1", features = ["derive"] }
rand = "0.9"
chrono = "0.4"
fast_qr = { version = "0.14", features = ["svg"] }
tower-http = { version = "0.7", features = ["trace", "compression-gzip", "limit"] }
age = "0.12"
# Default-features off avoids the aws-lc-rs C crypto dependency (needs cmake in
# the Docker build stage); ring + reqwest/rustls-no-provider keep everything
# pure Rust. `build_store` installs the ring rustls crypto provider at startup.
object_store = { version = "0.14", default-features = false, features = ["aws-base", "reqwest", "ring"] }
# Direct reqwest dependency so TLS can be enabled without aws-lc-rs: features
# unify with object_store's reqwest use, providing the TLS module it needs.
reqwest = { version = "0.13", default-features = false, features = ["http2", "stream", "rustls-no-provider"] }
# Crypto provider for reqwest's rustls-no-provider; ring keeps builds free of C deps.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

[dev-dependencies]
regex = "1"
# Same reqwest major as the regular dependency to avoid duplicate rlib candidates
# in test targets; rustls-no-provider keeps the ring-based TLS setup of the lib.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "form", "json", "cookies"] }

[[test]]
name = "unit_building_crud"
path = "tests/unit/building_crud.rs"

[[test]]
name = "unit_pdf_response"
path = "tests/unit/pdf_response.rs"
