# cargo-audit configuration, also picked up by rustsec/audit-check in CI.

[advisories]
ignore = [
  # RUSTSEC-2026-0387: timing variability in constant-time operations in
  # crypto-bigint 0.5.5.
  #
  # Reminder to remove this entry: https://github.com/uhlig-it/kehrkraft/issues/31
  #
  # crypto-bigint 0.5.5 is pinned by elliptic-curve 0.13 via age -> p256 0.13.
  # The first fixed release, 0.7.6, is a semver-major bump that age 0.12.1 (the
  # newest release) does not accept, so this cannot be resolved without an
  # upstream age release. Not reachable here: we only use age's passphrase API
  # (Encryptor::with_user_passphrase and scrypt::Identity), while p256 and thus
  # crypto-bigint are only exercised by age's p256tag recipient.
  #
  # Tracked upstream in https://github.com/str4d/rage/pull/648, which moves p256
  # to 0.14 and crypto-bigint to 0.7.6.
  "RUSTSEC-2026-0387",

  # RUSTSEC-2026-0459: SQLite before 3.54.0 returns uninitialized page-cache
  # memory when the database is opened together with a sibling -wal file whose
  # page size differs from the database's (CVE-2026-119375, libsqlite3-sys
  # 0.30.1).
  #
  # Reminder to remove this entry: https://github.com/uhlig-it/kehrkraft/issues/36
  #
  # sqlx-sqlite 0.9.0, the newest release, requires libsqlite3-sys
  # ">=0.30.1, <0.38.0", while the advisory is fixed in 0.39.0 (SQLite 3.54.0,
  # shipped with rusqlite 0.41). Every version sqlx accepts is affected, and
  # sqlx's main branch still pins 0.37.0, so no released combination clears
  # this. Dropping the bundled SQLite would not help either: cargo-audit flags
  # the crate version, not the feature set.
  #
  # Not reachable here: only a process that opens a database file together with
  # a -wal file written by a less trusted party is exposed, i.e. an attacker
  # needs write access to the directory holding kehrkraft.db. Such an attacker
  # can tamper with the database itself, so this adds no new capability. The
  # database is an app-owned file (src/db/mod.rs) that the app switches to WAL
  # mode itself (src/backup/mod.rs); no third-party database files are opened.
  "RUSTSEC-2026-0459",
]
